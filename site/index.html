<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e1420" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>idea-radar</title>
<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <h1>idea-radar</h1>
    <div class="bar-actions">
      <button id="groupToggle" type="button" title="소스별 보기 전환">소스별</button>
      <button id="seenBtn" type="button">여기까지 봤음</button>
    </div>
  </div>
  <div id="banner" hidden></div>
  <input id="q" type="search" placeholder="검색 — 제목·한줄설명 (최근 12개월)" autocomplete="off">
  <div id="chips" hidden>
    <div class="chip-row" id="sourceChips"></div>
    <div class="chip-row" id="periodChips"></div>
  </div>
  <div id="visitLine"></div>
</header>
<main id="list"></main>
<section id="showhnBlock" hidden>
  <button id="showhnToggle" type="button">Show HN 펼치기</button>
  <div id="showhnList" hidden></div>
</section>
<footer class="foot"><span id="footNote"></span></footer>
<script src="app.js" defer></script>
</body>
</html>
